ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    publish_tf: true

    # Odometria das rodas: vx e vyaw
    odom0: /odom
    odom0_config: [false, false, false,   # x,     y,      z       (posição)
                   false, false, false,   # roll,  pitch,  yaw     (orientação)
                   true,  false, false,   # vx,    vy,     vz      (velocidade linear)
                   false, false, true,    # vroll, vpitch, vyaw    (velocidade angular)
                   false, false, false]   # ax,    ay,     az      (aceleração linear)
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Odometria do lidar (rf2o): descomentar só se o yaw das rodas derivar muito
    # odom1: /odom_rf2o
    # odom1_config: [false, false, false,
    #                false, false, false,
    #                true,  false, false,
    #                false, false, true,
    #                false, false, false]
    # odom1_queue_size: 10

    # IMU (descomentar quando a RealSense chegar): só vyaw
    # imu0: /imu
    # imu0_config: [false, false, false,
    #               false, false, false,
    #               false, false, false,
    #               false, false, true,
    #               false, false, false]
    # imu0_differential: false
    # imu0_relative: false
    # imu0_queue_size: 10

