controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    # Declaração dos controladores
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# Configuração específica do Diff Drive
diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["rev2"]
    right_wheel_names: ["rev1"]
    
    # Valores baseados no seu URDF (origin xyz=0.2235 e massas)
    wheel_separation: 0.448
    wheel_radius: 0.074
    
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.01, 0.01, 0.01, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.01, 0.01, 0.01, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    use_stamped_vel: false